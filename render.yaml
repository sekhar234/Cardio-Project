# Render Blueprint: one web service + one managed PostgreSQL.
# Neo4j (Aura) and Qdrant (Cloud) are managed externally; set their secrets in the dashboard.
services:
  - type: web
    name: cardio4cities
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase: { name: cardio4cities-db, property: connectionString }
      - { key: OPENAI_API_KEY, sync: false }
      - { key: TAVILY_API_KEY, sync: false }
      - { key: NEO4J_URI, sync: false }
      - { key: NEO4J_USER, sync: false }
      - { key: NEO4J_PASSWORD, sync: false }
      - { key: QDRANT_URL, sync: false }
      - { key: QDRANT_API_KEY, sync: false }
      - { key: ACCESS_CODE, sync: false }
databases:
  - name: cardio4cities-db
    plan: basic-256mb
